[package]
name = "docfindy"
version = "0.3.0"
description = "DocFindy — AI file-finding agent"
authors = ["Guillaume"]
edition = "2021"
license = "MIT"

[lib]
name = "docfindy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# `test` brings in the mock runtime, which is the only way to get a real
# asset-protocol Scope in a unit test.
tauri = { version = "2", features = ["test"] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
anyhow = "1"
base64 = "0.22"
walkdir = "2"
