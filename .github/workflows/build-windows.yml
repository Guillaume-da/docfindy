name: build-windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    outputs:
      # SignPath identifies the artifact to sign by this id, not by name.
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --- sidecar 1: docfindy-engine (document indexer, PyInstaller onefile)
      - name: Build docfindy-engine sidecar
        working-directory: engine
        run: |
          pip install pypdf pyinstaller
          pyinstaller engine.spec
        shell: bash

      # --- sidecar 2: rtk (Rust Token Killer)
      # Pinned to a reviewed tag: an unpinned --git install would pull whatever
      # is on main at build time straight into the shipped installer.
      - name: Build rtk sidecar
        run: cargo install --git https://github.com/rtk-ai/rtk --tag v0.9.4 --locked
        shell: bash

      # Tauri expects sidecars suffixed with the target triple
      - name: Stage sidecars
        run: |
          TRIPLE=x86_64-pc-windows-msvc
          mkdir -p src-tauri/binaries
          cp engine/dist/docfindy-engine.exe "src-tauri/binaries/docfindy-engine-$TRIPLE.exe"
          cp "$USERPROFILE/.cargo/bin/rtk.exe" "src-tauri/binaries/rtk-$TRIPLE.exe"
        shell: bash

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri app (NSIS installer)
        run: npm run tauri build -- --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: docfindy-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe

  # Authenticode signing through SignPath, which is free for open-source
  # projects. Without it Windows reports "Unknown publisher" and SmartScreen
  # blocks the download, so an unsigned installer is awkward to share.
  #
  # Skipped entirely until the repository is enrolled, so the build keeps
  # working for anyone who has not set the variables up. See README, "Signing
  # the Windows installer".
  sign:
    needs: windows-installer
    if: vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the signed installer to the release
      actions: read # SignPath verifies the run that produced the artifact
    steps:
      - name: Submit signing request
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          # Tag builds get the release policy; a manual run gets test-signing,
          # so a dry run cannot spend a release signature.
          signing-policy-slug: >-
            ${{ startsWith(github.ref, 'refs/tags/v')
                && vars.SIGNPATH_RELEASE_POLICY_SLUG
                || vars.SIGNPATH_TEST_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_SLUG }}
          github-artifact-id: ${{ needs.windows-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Checksum
        run: |
          cd signed
          sha256sum *.exe | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: docfindy-windows-installer-signed
          path: signed/*

      # The release is created by hand; this only attaches the signed build to
      # it, replacing whatever is already there under the same name.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" signed/*.exe signed/SHA256SUMS.txt \
            --clobber --repo "${GITHUB_REPOSITORY}"
